<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CPR Helper">
  <meta name="description" content="NFC感應即開：CPR Helper 每分鐘110次CPR節拍器與AED圖解速查。">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>CPR Helper - 110 BPM CPR 節拍器 & AED 圖解速查</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="app-container">

    <!-- 頂部精簡列 -->
    <header class="top-header">
      <div class="brand-badge">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">CPR Helper</h1>
          <span class="brand-sub">110 BPM 急救小助手</span>
        </div>
      </div>

      <div class="header-status">
        <span id="wake-status" class="status-badge wake">螢幕常亮</span>
        <button id="mute-toggle-btn" class="icon-btn" title="切換靜音">
          <svg id="sound-icon-on" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg id="sound-icon-off" class="hidden" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 主區塊：CPR 110 BPM 節拍器 -->
    <main class="main-content">
      
      <!-- 核心節奏視覺大圓盤 -->
      <section class="metronome-card">
        <div class="cpr-visual-area">
          <div id="pulse-visualizer" class="pulse-ring-container">
            <div class="outer-glow-ring"></div>
            <div id="heart-disc" class="heart-pulse-disc" title="點擊暫停或繼續">
              <svg class="heart-icon" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- 唯一主按鈕：開始 / 暫停 -->
        <button id="toggle-btn" class="main-toggle-btn ready-start">
          <svg id="icon-play" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="icon-pause" class="hidden" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
          <span id="toggle-text">開始節拍</span>
        </button>

        <!-- 輕量施救計時提醒 (每2分鐘換人) -->
        <div class="timer-badge-row">
          <div class="time-pill">
            <span class="time-label">施救計時</span>
            <span id="timer-display" class="time-value">00:00</span>
          </div>
          <div class="reminder-text">（每 2 分鐘換人按壓）</div>
        </div>

        <!-- CPR 4 大口訣 -->
        <div class="quick-mnemonic-row">
          <div class="mnemonic-tag"><strong>用力壓</strong> 5~6cm</div>
          <div class="mnemonic-tag"><strong>快快壓</strong> 100-120/分</div>
          <div class="mnemonic-tag"><strong>胸回彈</strong> 完全放鬆</div>
          <div class="mnemonic-tag"><strong>莫中斷</strong> &lt;10秒</div>
        </div>
      </section>

      <!-- 次區塊：AED 4 步驟圖解速查指南 (圖示為主、極簡文字) -->
      <section class="aed-section">
        <div class="section-title-bar">
          <span class="section-title-icon">⚡</span>
          <h2 class="section-title-text">AED 4 步驟圖解 (開、貼、插、電)</h2>
        </div>

        <!-- 2x2 圖文卡片網格 -->
        <div class="aed-visual-grid">
          
          <!-- 圖解 1: 開 (Power Button Only) -->
          <div class="aed-card">
            <div class="card-step-badge">1. <span class="badge-char">開</span></div>
            <div class="aed-illustration">
              <svg viewBox="0 0 100 90" class="step-svg">
                <defs>
                  <linearGradient id="powerBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#10b981" />
                    <stop offset="100%" stop-color="#047857" />
                  </linearGradient>
                  <radialGradient id="powerGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
                    <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
                  </radialGradient>
                </defs>
                <!-- 綠色脈衝光暈環 -->
                <circle cx="50" cy="45" r="42" fill="url(#powerGlow)" />
                <circle cx="50" cy="45" r="37" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.65" />
                <!-- 電源鈕主體大圓盤 -->
                <circle cx="50" cy="45" r="30" fill="#042f2e" stroke="#10b981" stroke-width="3.5" />
                <circle cx="50" cy="45" r="24" fill="url(#powerBtnGrad)" stroke="#34d399" stroke-width="1.5" />
                <!-- 國際標準電源符號 (IEC Power Symbol) -->
                <path d="M 57 32.5 A 13.5 13.5 0 1 1 43 32.5" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" />
                <line x1="50" y1="23" x2="50" y2="42" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" />
              </svg>
            </div>
            <div class="card-info">
              <div class="card-main-title"><span class="step-key-char">開</span>啟電源</div>
              <div class="card-sub-text">掀蓋或按開關 ‧ 聽語音</div>
            </div>
          </div>

          <!-- 圖解 2: 貼 (Pads: 完整人型上半身 右上左下) -->
          <div class="aed-card highlight-card">
            <div class="card-step-badge">2. <span class="badge-char">貼</span></div>
            <div class="aed-illustration">
              <img src="./images/aed_pads_guide.png" class="step-img-human" alt="AED 貼片人型圖解">
            </div>
            <div class="card-info">
              <div class="card-main-title"><span class="step-key-char">貼</span>上貼片</div>
              <div class="card-sub-text">人型對照 ‧ 右上左下</div>
            </div>
          </div>

          <!-- 圖解 3: 插 (Plug Connector) -->
          <div class="aed-card">
            <div class="card-step-badge">3. <span class="badge-char">插</span></div>
            <div class="aed-illustration">
              <svg viewBox="0 0 100 90" class="step-svg">
                <!-- 機器面板插孔 -->
                <rect x="15" y="24" width="26" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2.5" />
                <circle cx="28" cy="45" r="9" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
                <!-- 閃爍光環 -->
                <circle cx="28" cy="45" r="14" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" />
                <!-- 插入箭頭 -->
                <path d="M 48 45 L 39 45 M 43 40 L 38 45 L 43 50" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
                <!-- 導線插頭與電線 -->
                <rect x="52" y="40" width="6" height="10" rx="1.5" fill="#e2e8f0" />
                <path d="M 58 34 L 76 34 C 79 34 81 36 81 39 L 81 51 C 81 54 79 56 76 56 L 58 56 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
                <path d="M 81 45 C 93 45 95 62 95 72" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" />
              </svg>
            </div>
            <div class="card-info">
              <div class="card-main-title"><span class="step-key-char">插</span>上插頭</div>
              <div class="card-sub-text">接妥閃爍插孔 (若已接略過)</div>
            </div>
          </div>

          <!-- 圖解 4: 電 (Shock Lightning Button Only) -->
          <div class="aed-card alert-card">
            <div class="card-step-badge alert-badge">4. <span class="badge-char">電</span></div>
            <div class="aed-illustration">
              <svg viewBox="0 0 100 90" class="step-svg">
                <defs>
                  <linearGradient id="shockBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ef4444" />
                    <stop offset="100%" stop-color="#b91c1c" />
                  </linearGradient>
                  <radialGradient id="shockGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45" />
                    <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
                  </radialGradient>
                </defs>
                <!-- 紅色警示脈衝光暈環 -->
                <circle cx="50" cy="45" r="42" fill="url(#shockGlow)" />
                <circle cx="50" cy="45" r="37" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75" />
                <!-- 醒目電擊大按鈕主體 -->
                <circle cx="50" cy="45" r="30" fill="#7f1d1d" stroke="#fca5a5" stroke-width="3.5" />
                <circle cx="50" cy="45" r="24" fill="url(#shockBtnGrad)" stroke="#f87171" stroke-width="1.5" />
                <!-- 閃爍黃金閃電符號 -->
                <path d="M 53 23 L 40 44 L 49 44 L 45 67 L 62 41 L 51 41 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1" />
              </svg>
            </div>
            <div class="card-info">
              <div class="card-main-title">請大家離開。<span class="step-key-char">電</span>擊</div>
              <div class="card-sub-text">確認無人碰觸 ‧ 按下電擊鈕</div>
            </div>
          </div>

        </div>

        <!-- 電擊後立即 CPR 核心提醒條 -->
        <div class="post-shock-banner">
          <span class="shock-icon">⚡</span>
          <span><strong>電擊後立即接續 CPR 按壓</strong>，不要中斷！</span>
        </div>
      </section>

      <footer class="app-footer">
        <p>CPR Helper ‧ NFC 急救感應專用 ‧ 支援 100% 離線使用</p>
      </footer>

    </main>

  </div>

  <!-- 腳本 -->
  <script src="./js/metronome.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/sw-register.js"></script>
</body>
</html>
